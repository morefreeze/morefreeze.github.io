name: Build and deploy Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: '23 18 * * *' # Daily at 02:23 Asia/Shanghai, after the RSS update.
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after a successful build
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Refresh ForeverBlog recommendations
        run: node _scripts/refresh-foreverblog.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Add deployment health marker
        run: printf '%s\n' "$GITHUB_SHA" > logseq-publisher-health.txt
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify pagination and sidebar in built site
        run: node tests/verify-built-site.cjs _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
  deploy:
    if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
