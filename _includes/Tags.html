<div class="sidebar-module">
  <details>
  <summary>{{ site.locales[site.default_locale].Tags }}</summary>
  <div class="sidebar-tags">
  {% for tag in site.tags %}
    <a href="{{ site.baseurl }}/tags/#{{ tag[0] }}" title="{{ tag[0] }}" rel="{{ tag[1].size }}">{{ tag[0] }}</a> &nbsp;
  {% endfor %}
  </div>
  </details>
</div>
